<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Zip 拼圖遊戲</title>
<link rel="icon" type="image/png" href="src/icon.png">
<link rel="apple-touch-icon" href="src/icon.png">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f3f2ef;height:100%;display:flex;justify-content:center;align-items:flex-start;padding:12px 6px;overscroll-behavior:none;overflow-y:auto;-webkit-overflow-scrolling:touch}
.container{background:#fff;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.1);padding:18px 16px 14px;max-width:480px;width:100%;display:flex;flex-direction:column;align-items:center}
h1{font-size:1.8rem;color:#0a66c2;letter-spacing:2px;margin-bottom:10px}
.diff-bar{display:flex;border-radius:10px;overflow:hidden;border:1.5px solid #ddd;margin-bottom:10px;width:100%;max-width:420px}
.diff-pill{flex:1;padding:9px 2px;font-size:.78rem;background:#fff;border:none;border-right:1px solid #eee;cursor:pointer;font-family:inherit;color:#777;transition:all .15s;font-weight:600;letter-spacing:.5px}
.diff-pill:last-child{border-right:none}
.diff-pill.active{background:#0a66c2;color:#fff}
.diff-pill[data-d="fog"].active{background:#6a5acd;color:#fff}
.diff-pill[data-d="cube"].active{background:#e67e22;color:#fff}
.cube-size-bar{display:flex;justify-content:center;gap:6px;margin-bottom:8px}
.size-pill{padding:5px 18px;font-size:.76rem;background:#fff;border:1.5px solid #e67e22;border-radius:20px;cursor:pointer;font-family:inherit;color:#e67e22;font-weight:600;transition:all .15s}
.size-pill.active{background:#e67e22;color:#fff}
.info-bar{display:flex;justify-content:center;align-items:center;gap:10px;width:100%;margin-bottom:8px;font-size:.82rem;color:#888}
#timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:.95rem;color:#333}
.info-sep{color:#ccc}
.unfolded-map{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(3,1fr);gap:3px;margin-bottom:8px;justify-content:center;width:fit-content;margin-left:auto;margin-right:auto}
.um-face{border-radius:4px;border:2px solid transparent;transition:border-color .2s;position:relative;display:grid;gap:1px;padding:1px;background:#cdc8be}
.um-face.active{border-color:#e67e22}
.um-face .um-label{position:absolute;top:-12px;left:50%;transform:translateX(-50%);font-size:.5rem;color:#999;white-space:nowrap}
.um-cell{border-radius:2px;background:#e8e4de;aspect-ratio:1}
.um-cell.path{background:#0a66c2}
.um-cell.head{background:#0d84e0}
.um-cell.checkpoint{background:#fff;border:1px solid #0a66c2}
.um-cell.checkpoint.path{background:#0a66c2;border-color:#0a66c2}
.um-face:nth-child(1){grid-column:2;grid-row:1}
.um-face:nth-child(2){grid-column:1;grid-row:2}
.um-face:nth-child(3){grid-column:2;grid-row:2}
.um-face:nth-child(4){grid-column:3;grid-row:2}
.um-face:nth-child(5){grid-column:4;grid-row:2}
.um-face:nth-child(6){grid-column:2;grid-row:3}
.cube-game-wrap{perspective:800px;margin:0 auto 8px;display:flex;align-items:center;justify-content:center;touch-action:none;user-select:none;-webkit-user-select:none;border:2px solid #ddd;border-radius:12px;background:#fafaf8;position:relative}
.cube-game{position:relative;transform-style:preserve-3d;transition:transform .4s ease}
.cube-face{position:absolute;display:grid;gap:3px;padding:3px;border-radius:8px;background:rgba(205,200,190,.9);backface-visibility:visible}
.cube-face.active-face{background:rgba(205,200,190,1);box-shadow:0 0 0 2px rgba(230,126,34,.4)}
.cube-face .cell{background:#e8e4de;border-radius:4px;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;overflow:visible;-webkit-tap-highlight-color:transparent}
.cube-face .cell .num{font-weight:700;font-size:1rem;color:transparent;pointer-events:none;position:relative;z-index:2}
.cube-face .cell.checkpoint{background:#fff;border:2px solid #0a66c2}
.cube-face .cell.checkpoint .num{color:#0a66c2;font-size:1.05rem}
.cube-face .cell.checkpoint.unrevealed{border-color:#b0a090;background:#f5f0e8}
.cube-face .cell.checkpoint.unrevealed .num{color:#b0a090}
.cube-face .cell.path{background:#0a66c2;box-shadow:0 0 0 1px #0a66c2}
.cube-face .cell.path .num{color:rgba(255,255,255,.35);font-size:.65rem}
.cube-face .cell.path.checkpoint{border-color:#0a66c2}
.cube-face .cell.path.checkpoint .num{color:#fff;font-size:1.05rem}
.cube-face .cell.path.checkpoint.unrevealed .num{color:rgba(255,255,255,.7)}
.cube-face .cell.head{background:#0d84e0;box-shadow:0 0 0 1.5px #0d84e0,0 0 6px rgba(10,102,194,.4);transform:scale(1.05)}
.cube-face .cell.start-hint{animation:pulse 1.8s ease-in-out infinite}
.cube-game.won .cube-face .cell.path{animation:pop .4s ease-out;animation-delay:calc(var(--i)*25ms);animation-fill-mode:both}
.cube-game.won .cube-face .cell.path.checkpoint .num{color:#fff}
.cube-game.won .cube-face .wall{background:#1a7a16}
.cube-game.revealed .cube-face .cell.path{background:#7a9bb5;box-shadow:0 0 0 1px #7a9bb5}
.cube-game.revealed .cube-face .cell.path .num{color:rgba(255,255,255,.5)}
.cube-game.revealed .cube-face .cell.path.checkpoint .num{color:#fff}
.cube-game.revealed .cube-face .cell.head{background:#7a9bb5;box-shadow:0 0 0 1px #7a9bb5;transform:none}
.grid-wrap{position:relative;margin-bottom:8px}
.grid{display:inline-grid;gap:3px;touch-action:none;user-select:none;-webkit-user-select:none;background:#cdc8be;padding:3px;border-radius:10px;--g:3px}
.cell{aspect-ratio:1;background:#e8e4de;border-radius:4px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .1s,transform .1s,box-shadow .1s;position:relative;overflow:visible;-webkit-tap-highlight-color:transparent}
.cell .num{font-weight:700;font-size:1.1rem;color:transparent;pointer-events:none;position:relative;z-index:2}
@media(hover:hover){.cell:hover:not(.path):not(.blackhole){background:#ddd8d0}}
.cell.checkpoint{background:#fff;border:2px solid #0a66c2}
.cell.checkpoint .num{color:#0a66c2;font-size:1.15rem}
.cell.checkpoint.unrevealed{border-color:#b0a090;background:#f5f0e8}
.cell.checkpoint.unrevealed .num{color:#b0a090}
.cell.path{background:#0a66c2;box-shadow:0 0 0 1.5px #0a66c2}
.cell.path .num{color:rgba(255,255,255,.35);font-size:.7rem}
.cell.path.checkpoint{border-color:#0a66c2}
.cell.path.checkpoint .num{color:#fff;font-size:1.15rem}
.cell.path.checkpoint.unrevealed .num{color:rgba(255,255,255,.7)}
.cell.head{background:#0d84e0;box-shadow:0 0 0 1.5px #0d84e0,0 0 8px rgba(10,102,194,.4);transform:scale(1.04)}
.num.underline{text-decoration:underline;text-underline-offset:2px}
.cell.blackhole{background:#444;cursor:default}
.cell.blackhole .num{color:#666;font-size:1.2rem}
.cell.start-hint{animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(10,102,194,.5)}50%{box-shadow:0 0 0 10px rgba(10,102,194,0)}}
.wall{position:absolute;background:#444;z-index:6;pointer-events:none;border-radius:2px}
.wall-right{top:calc(var(--g)*-1);right:calc(var(--g)*-1 - 1px);width:calc(var(--g) + 2px);height:calc(100% + var(--g)*2)}
.wall-bottom{left:calc(var(--g)*-1);bottom:calc(var(--g)*-1 - 1px);width:calc(100% + var(--g)*2);height:calc(var(--g) + 2px)}
.toolbar{display:flex;justify-content:center;width:100%;max-width:360px;margin-bottom:6px}
.tool-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px;background:none;border:none;cursor:pointer;font-family:inherit;color:#666;transition:color .15s;border-radius:8px}
.tool-btn:active{background:#f0f0f0;color:#0a66c2}
.tool-icon{font-size:1.25rem;line-height:1}
.tool-label{font-size:.68rem;font-weight:500}
.tool-btn.danger-tool{color:#b44}
.tool-btn.danger-tool:active{color:#c00}
.link-btn{background:none;border:none;color:#999;font-size:.76rem;cursor:pointer;text-decoration:underline;margin-bottom:10px;font-family:inherit}
.link-btn:hover{color:#0a66c2}
.grid.won .cell.path{animation:pop .4s ease-out;animation-delay:calc(var(--i)*25ms);animation-fill-mode:both}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(.85);background:#38a832}100%{transform:scale(1);background:#2e9e28}}
.grid.won .cell.path.checkpoint .num{color:#fff}
.grid.won .wall{background:#1a7a16}
.grid.revealed .cell.path{background:#7a9bb5;box-shadow:0 0 0 1.5px #7a9bb5}
.grid.revealed .cell.path .num{color:rgba(255,255,255,.5)}
.grid.revealed .cell.path.checkpoint .num{color:#fff}
.grid.revealed .cell.head{background:#7a9bb5;box-shadow:0 0 0 1.5px #7a9bb5;transform:none}
.win-overlay{display:none;flex-direction:column;align-items:center;gap:10px;padding:16px;background:rgba(255,255,255,.95);border-radius:12px;border:2px solid #2e9e28;margin-bottom:8px;text-align:center;width:100%}
.win-overlay.show{display:flex}
.win-overlay h2{font-size:1.2rem;color:#2e9e28}
.win-overlay p{color:#555;font-size:.84rem}
.win-overlay.answer-reveal{border-color:#7a9bb5}
.win-overlay.answer-reveal h2{color:#5a7b95}
.win-buttons{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.win-buttons .btn{font-family:inherit;font-size:.8rem;padding:7px 12px;border-radius:8px;border:1.5px solid #ddd;background:#fff;color:#333;cursor:pointer;transition:all .15s}
.win-buttons .btn:hover{border-color:#0a66c2;background:#f0f7ff}
.win-buttons .btn.primary{background:#0a66c2;color:#fff;border-color:#0a66c2}
.sect-row{display:flex;justify-content:center;width:100%;max-width:420px;margin-bottom:4px}
.sect-toggle{padding:8px 20px;background:#f8f8f6;border:1px solid #e0e0e0;border-radius:8px;cursor:pointer;font-family:inherit;font-size:.84rem;color:#777;text-align:center;transition:background .15s}
.sect-toggle:hover{background:#f0f0ee}
.sect-body{width:100%;max-width:420px;padding:10px 4px 0}
.stats-table{width:100%;border-collapse:collapse;font-size:.82rem;margin-bottom:6px}
.stats-table th{text-align:left;padding:5px 6px;border-bottom:2px solid #e0e0e0;color:#666;font-weight:600}
.stats-table td{padding:4px 6px;border-bottom:1px solid #f0f0f0}
.stats-table tr.total td{border-top:2px solid #e0e0e0;font-weight:600}
.streak-info{font-size:.82rem;color:#666;text-align:center;margin-bottom:4px}
.clear-stats{display:block;margin:2px auto 0;font-size:.74rem;color:#aaa;background:none;border:none;cursor:pointer;text-decoration:underline}
.clear-stats:hover{color:#c00}
.credit{font-size:.72rem;color:#aaa;text-align:center;margin-top:12px;line-height:1.5;padding:0 8px}
.credit a{color:#999;text-decoration:underline}
.credit a:hover{color:#0a66c2}
.generating{position:absolute;inset:0;background:rgba(255,255,255,.85);display:flex;align-items:center;justify-content:center;font-size:1rem;color:#666;border-radius:10px;z-index:10}
#toastBox{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:#333;color:#fff;padding:10px 20px;border-radius:8px;font-size:.86rem;animation:fadeIn .3s,fadeOut .5s 2.5s forwards;white-space:nowrap}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeOut{from{opacity:1}to{opacity:0}}
#rotateOverlay{position:fixed;inset:0;z-index:9999;background:#1a1a2e;color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:20px}
#rotateOverlay .rotate-icon{font-size:4rem;animation:rotateTilt 1.5s ease-in-out infinite}
#rotateOverlay p{font-size:1.1rem;opacity:.85}
@keyframes rotateTilt{0%,100%{transform:rotate(0)}50%{transform:rotate(90deg)}}
@media(orientation:landscape) and (max-height:500px){#rotateOverlay{display:flex!important}}
.hidden{display:none!important}
@media(hover:none) and (pointer:coarse){
    .tool-btn{padding:12px 4px;min-height:52px}
    .tool-icon{font-size:1.35rem}
    .diff-pill{padding:11px 2px;min-height:42px}
    .win-buttons .btn{min-height:42px;padding:9px 14px}
}
@media(max-width:420px){
    body{padding:6px 4px}
    .container{padding:14px 10px 10px;border-radius:10px}
    h1{font-size:1.5rem;margin-bottom:8px}
    .diff-pill{font-size:.72rem;padding:8px 1px}
    .info-bar{font-size:.78rem;gap:6px}
    #timer{font-size:.88rem}
    .win-overlay{padding:12px}
    .win-overlay h2{font-size:1.05rem}
    .win-overlay p{font-size:.78rem}
    .win-buttons .btn{font-size:.76rem;padding:6px 9px}
}
@media(max-width:360px){
    .container{padding:10px 6px 8px}
    h1{font-size:1.3rem}
    .diff-pill{font-size:.68rem}
    .grid{gap:2px;padding:2px;--g:2px}
    .tool-label{font-size:.62rem}
}
</style>
</head>
<body>
<div class="container">
<h1><img src="src/icon.png" alt="icon" style="height:1.6em;vertical-align:middle;margin-right:4px">ZIP</h1>
<div class="diff-bar" id="diffBar">
<button class="diff-pill active" data-d="easy">簡單</button>
<button class="diff-pill" data-d="expert">困難</button>
<button class="diff-pill" data-d="fog">迷霧</button>
<button class="diff-pill" data-d="cube">3D方塊</button>
</div>
<div class="cube-size-bar hidden" id="cubeSizeBar">
<button class="size-pill active" data-sz="2">2×2</button>
<button class="size-pill" data-sz="3">3×3</button>
</div>
<div class="info-bar">
<span id="timer">00:00</span>
<span class="info-sep">·</span>
<span id="progress">0/25</span>
<span class="info-sep">·</span>
<span id="nextTarget">下一個: 1</span>
</div>
<div id="unfoldedMap" class="unfolded-map hidden"></div>
<div class="cube-game-wrap hidden" id="cubeGameWrap">
<div class="cube-game" id="cubeGame"></div>
</div>
<div class="grid-wrap" id="gridWrap">
<div class="grid" id="grid"></div>
<div class="generating hidden" id="generating">正在生成謎題...</div>
</div>
<div class="toolbar">
<button class="tool-btn" id="newGameBtn"><span class="tool-icon">🔄</span><span class="tool-label">新遊戲</span></button>
<button class="tool-btn" id="hintBtn"><span class="tool-icon">💡</span><span class="tool-label">提示</span></button>
<button class="tool-btn" id="clearBtn"><span class="tool-icon">🗑️</span><span class="tool-label">清除</span></button>
<button class="tool-btn danger-tool" id="answerBtn"><span class="tool-icon">👁️</span><span class="tool-label">答案</span></button>
</div>
<button class="link-btn" id="loadCodeBtn">載入挑戰碼</button>
<div class="win-overlay" id="winOverlay">
<h2 id="winTitle">恭喜完成！</h2>
<p id="winText"></p>
<div class="win-buttons">
<button class="btn" id="shareBtn">📋 分享</button>
<button class="btn" id="codeBtn">🔗 挑戰碼</button>
<button class="btn" id="replayBtn">▶ 回放</button>
<button class="btn primary" id="playAgainBtn">再來一局</button>
</div>
</div>
<div class="sect-row">
<button class="sect-toggle" id="statsTgl">紀錄 ▾</button>
</div>
<div class="sect-body hidden" id="statsBody"></div>
<p class="credit">靈感100%來自 <a href="https://www.linkedin.com/games/zip/" target="_blank" rel="noopener">LinkedIn Zip</a> 遊戲。因為每天只能玩一題不過癮，所以自己做了一個XD，還加了更難的玩法來試玩ㄏㄏ。</p>
</div>
<div id="toastBox"></div>
<div id="rotateOverlay"><div class="rotate-icon">📱</div><p>請將手機轉為直向<br>即可開始遊戲</p></div>
<script>
const CONFIGS = {
    easy:   {rows:5,cols:5,cpRange:[5,7], wallRange:[0,3], bhRange:[0,1],label:'簡單',pr:false},
    expert: {rows:8,cols:8,cpRange:[12,22],wallRange:[4,16],bhRange:[0,2],label:'困難',pr:false},
    fog:    {rows:8,cols:8,cpRange:[12,22],wallRange:[4,16],bhRange:[0,2],label:'迷霧',pr:true},
    cube:   {rows:2,cols:2,cpRange:[6,8],wallRange:[0,2],bhRange:[0,0],label:'3D方塊',pr:false},
};
const SK='zip_stats',PK='zip_prefs';
let puzzle=null,userPath=[],pathSet=new Set(),pathIndexMap=new Map();
let isDrawing=false,gameWon=false,answerRevealed=false,isAnimating=false,animTimer=null;
let startTime=null,timerHandle=null,cellEls=[];
let hintsUsed=false,winningPath=null;
let progressiveReveal=false,revealedNums=new Set();
let selectedDiff='easy';
let cubeMode=false, currentFace=0;
let cubeMat=[1,0,0, 0,1,0, 0,0,1];
let isDragRotating=false, dragStartX=null, dragStartY=null, dragMoved=0;
let lastCubeTC=null;
let cubeCellEls={};
let cubeAnimId=null;
const $=id=>document.getElementById(id);
const gridEl=$('grid'),timerEl=$('timer');
const progressEl=$('progress'),nextEl=$('nextTarget');
const winOv=$('winOverlay'),winTitle=$('winTitle'),winText=$('winText');
const genOv=$('generating');
const unfoldedMap=$('unfoldedMap');
const gridWrap=$('gridWrap');
const cubeGameWrap=$('cubeGameWrap');
const cubeGame=$('cubeGame');
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function randInt(a,b){return a+Math.floor(Math.random()*(b-a+1))}
function isAdj(a,b){return Math.abs(a[0]-b[0])+Math.abs(a[1]-b[1])===1}
function key(r,c){return r+','+c}
function wallKey(r1,c1,r2,c2){return(r1>r2||(r1===r2&&c1>c2))?`${r2},${c2}-${r1},${c1}`:`${r1},${c1}-${r2},${c2}`}
function fmtTime(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function showToast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;$('toastBox').appendChild(t);setTimeout(()=>t.remove(),3200)}
function ck(f,r,c){return f+':'+r+','+c}
function cwk(f,r1,c1,r2,c2){return f+':'+wallKey(r1,c1,r2,c2)}
let cubeSz=2, cubeS=1;
let cubeSizeChoice=2;
function updateCubeSize(sz){
    cubeSizeChoice=sz;
    cubeSz=sz;
    cubeS=sz-1;
    if(sz===2){
        CONFIGS.cube.rows=2;CONFIGS.cube.cols=2;
        CONFIGS.cube.cpRange=[6,8];CONFIGS.cube.wallRange=[0,2];
    } else {
        CONFIGS.cube.rows=3;CONFIGS.cube.cols=3;
        CONFIGS.cube.cpRange=[8,12];CONFIGS.cube.wallRange=[0,6];
    }
}
function getCubeAdj(){
    const S=cubeS;
    return [
        [[2,(p)=>[S,p]], [5,(p)=>[p,0]], [3,(p)=>[0,p]], [4,(p)=>[p,S]]],
        [[2,(p)=>[0,S-p]], [4,(p)=>[p,0]], [3,(p)=>[S,S-p]], [5,(p)=>[p,S]]],
        [[1,(p)=>[0,S-p]], [5,(p)=>[0,S-p]], [0,(p)=>[0,p]], [4,(p)=>[0,p]]],
        [[0,(p)=>[S,p]], [5,(p)=>[S,p]], [1,(p)=>[S,S-p]], [4,(p)=>[S,S-p]]],
        [[2,(p)=>[p,0]], [0,(p)=>[p,0]], [3,(p)=>[S-p,0]], [1,(p)=>[p,S]]],
        [[2,(p)=>[S-p,S]], [1,(p)=>[p,0]], [3,(p)=>[p,S]], [0,(p)=>[p,S]]],
    ];
}
function getCubeNeighbors(f,r,c){
    const DIRS=[[-1,0],[0,1],[1,0],[0,-1]];
    const adj=getCubeAdj();
    const result=[];
    for(let d=0;d<4;d++){
        const[dr,dc]=DIRS[d];
        const nr=r+dr, nc=c+dc;
        if(nr>=0 && nr<cubeSz && nc>=0 && nc<cubeSz){
            result.push([f,nr,nc]);
        } else {
            const[nf,mapFn]=adj[f][d];
            const pos = (d===0||d===2) ? c : r;
            const[mr,mc]=mapFn(pos);
            result.push([nf,mr,mc]);
        }
    }
    return result;
}
function generateCubePath(){
    const SZ=cubeSz, TOTAL=cubeSz*cubeSz*6;
    for(let att=0;att<300;att++){
        const vis=Array.from({length:6},()=>Array.from({length:SZ},()=>Array(SZ).fill(false)));
        const path=[];
        let f=Math.floor(Math.random()*6), r=Math.floor(Math.random()*SZ), c=Math.floor(Math.random()*SZ);
        vis[f][r][c]=true; path.push([f,r,c]);

        let match=true;
        for(let i=0;i<userPath.length;i++)if(userPath[i][0]!==puzzle.solution[i][0]||userPath[i][1]!==puzzle.solution[i][1]){match=false;break}
        if(match&&userPath.length<puzzle.solution.length){addCell(puzzle.solution[userPath.length][0],puzzle.solution[userPath.length][1]);render();if(checkWin())onWin()}
        else if(!match){clearPath();addCell(puzzle.solution[0][0],puzzle.solution[0][1]);addCell(puzzle.solution[1][0],puzzle.solution[1][1]);render()}
    }
}
function newGame(){
    if(isAnimating){clearInterval(animTimer);isAnimating=false}
    gameWon=false;answerRevealed=false;hintsUsed=false;winningPath=null;clearPath();resetTimer();
    gridEl.classList.remove('won','revealed');
    cubeGame.classList.remove('won','revealed');
    winOv.classList.remove('show','answer-reveal');genOv.classList.remove('hidden');
    setTimeout(()=>{
        const dk=getDiff();
        if(dk==='cube'){
            cubeMode=true;
            currentFace=0;
            progressiveReveal=false;
            gridWrap.classList.add('hidden');
            unfoldedMap.classList.remove('hidden');
            cubeGameWrap.classList.remove('hidden');
            let p=null, tries=0;
            while(!p && tries<5){p=createCubePuzzle();tries++}
            if(!p){
                for(let i=0;i<10&&!p;i++) p=createCubePuzzle();
            }
            if(!p){
                showToast('生成3D方塊失敗，請重試');
                genOv.classList.add('hidden');
                return;
            }
            puzzle=p;
            cubeMat = eulerToMat(CUBE_ROT_PRESETS[0][0], CUBE_ROT_PRESETS[0][1]);
            initRevealed();
            buildUnfoldedMap();
            buildCubeGame();
            renderAllCubeFaces();
            updateMinimap();
            genOv.classList.add('hidden');
        } else {
            cubeMode=false;
            gridWrap.classList.remove('hidden');
            unfoldedMap.classList.add('hidden');
            cubeGameWrap.classList.add('hidden');
            progressiveReveal=CONFIGS[dk]?CONFIGS[dk].pr:false;
            let p=null,tries=0;while(!p&&tries<5){p=createPuzzle(dk);tries++}if(!p)p=createPuzzle('easy');
            puzzle=p;initRevealed();buildGrid();render();genOv.classList.add('hidden');
        }
    },30);
}
$('newGameBtn').onclick=newGame;$('playAgainBtn').onclick=newGame;
$('clearBtn').onclick=()=>{
    if(gameWon||answerRevealed||isAnimating)return;
    clearPath();resetTimer();
    if(cubeMode){renderAllCubeFaces();updateMinimap();}else{render();}
};
$('hintBtn').onclick=giveHint;$('answerBtn').onclick=showAnswer;
$('shareBtn').onclick=shareResult;$('codeBtn').onclick=copyCode;$('replayBtn').onclick=replayPath;$('loadCodeBtn').onclick=loadCode;
$('statsTgl').onclick=()=>{const b=$('statsBody');b.classList.toggle('hidden');$('statsTgl').textContent=b.classList.contains('hidden')?'紀錄 ▾':'紀錄 ▴'};
document.querySelectorAll('.diff-pill').forEach(p=>p.onclick=()=>selectDiff(p.dataset.d));
document.querySelectorAll('.size-pill').forEach(p=>p.onclick=()=>selectCubeSize(+p.dataset.sz));
document.addEventListener('keydown',e=>{
    if(e.key==='n'&&(e.ctrlKey||e.metaKey)){e.preventDefault();newGame()}
    if(e.key==='z'&&(e.ctrlKey||e.metaKey)&&!gameWon&&!answerRevealed){
        e.preventDefault();
        if(userPath.length>0){
            if(cubeMode){
                truncateToCube(userPath.length-2);
                if(userPath.length>0){
                    const headFace=userPath[userPath.length-1][0];
                    if(headFace!==currentFace) switchFace(headFace, true);
                    else renderAllCubeFaces();
                }
                updateMinimap();
            } else {
                truncateTo(userPath.length-2);render();
            }
        }
    }
});
window.addEventListener('resize',()=>{
    if(!puzzle)return;
    if(cubeMode){
        buildUnfoldedMap();buildCubeGame();renderAllCubeFaces();updateMinimap();
    } else {
        const sp=userPath.slice(),sw=gameWon,sa=answerRevealed;
        buildGrid();clearPath();for(const[r,c]of sp)addCell(r,c);gameWon=sw;answerRevealed=sa;
        if(gameWon)gridEl.classList.add('won');if(answerRevealed)gridEl.classList.add('revealed');render();
    }
});
renderStats();newGame();
</script>
</body>
</html>
