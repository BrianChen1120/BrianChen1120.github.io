  <style>
    html{ scroll-behavior:smooth; }

    /* Greeting overlay */
    .greeting-overlay {
      position: fixed; inset: 0; z-index: 99999;
      display: flex; align-items: center; justify-content: center;
      pointer-events: none;
    }
    .greeting-text {
      font-size: clamp(1.8rem, 5vw, 3.5rem);
      font-weight: 800;
      background: linear-gradient(135deg, #6366f1, #06b6d4, #f59e0b, #ec4899);
      background-size: 200% 200%;
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: greetIn 0.5s ease-out, greetGradient 3s ease infinite, greetOut 0.6s 2.5s ease-in forwards;
      opacity: 0; transform: scale(0.6);
      background-color: rgba(255,255,255,0.85);
      padding: .3rem 1.2rem;
      border-radius: .75rem;
      -webkit-text-fill-color: transparent;
    }
    [data-bs-theme="dark"] .greeting-text {
      background-color: rgba(30,30,30,0.85);
    }
    .confetti-trigger {
      cursor: pointer;
      display: inline-block;
      transition: transform 0.2s ease;
      user-select: none;
    }
    .confetti-trigger:hover { transform: scale(1.2); }
    .confetti-trigger:active { transform: scale(0.9); }
    @keyframes greetIn      { 0%{opacity:0;transform:scale(0.6)} 100%{opacity:1;transform:scale(1)} }
    @keyframes greetGradient { 0%,100%{background-position:0% 50%} 50%{background-position:100% 50%} }
    @keyframes greetOut      { 0%{opacity:1;transform:scale(1)} 100%{opacity:0;transform:scale(1.15) translateY(-20px)} }

    /* icon-only 按鈕（與首頁一致） */
    .icon-btn{ background:transparent; border:0; padding:.375rem; line-height:1; }
    .icon-btn:focus, .icon-btn:focus-visible{ outline:none; box-shadow:none; }
    .icon-btn:hover{ opacity:.85; }
    .nav-link .bi, .icon-btn .bi{ vertical-align:-2px; }

    /* 頁頭說明段 */
    .lead-wrap{ max-width:820px; margin-inline:auto; }

    /* ========= Gallery Grid：手機 1 欄；md+ 12 欄 ========= */
    .gallery-grid{
      --gap: 1rem;
      display: grid;
      gap: var(--gap);
      grid-template-columns: 1fr;                 /* < md: 1 欄（每列 1 張） */
    }
    @media (min-width:768px){
      .gallery-grid{
        grid-template-columns: repeat(12, 1fr);   /* md+ 使用 12 欄 */
        grid-auto-flow: row;                      /* 維持順序、避免 dense 亂塞 */
      }
    }

    /* 卡片外觀 */
    .g-item{
      position: relative; overflow: hidden; border-radius:.75rem;
      border:1px solid var(--bs-border-color); background:var(--bs-body-bg);
    }

    /* 固定比例框，避免載入跳動 */
    .g-media{ width:100%; display:block; }
    .ratio-3x2 .g-media{ aspect-ratio: 3 / 2; }  /* 寬圖：3:2 */
    .ratio-2x3 .g-media{ aspect-ratio: 2 / 3; }  /* 直圖：2:3 */

    /* 版面規則（你指定的需求）：
       3:2 一列 2 張 → 每張佔 6 欄；2:3 一列 3 張 → 每張佔 4 欄 */
    @media (min-width:768px){
      .ratio-3x2{ grid-column: span 6; }  /* 12 / 6 = 2 張/列 */
      .ratio-2x3{ grid-column: span 4; }  /* 12 / 4 = 3 張/列 */
    }

    /* 圖片鋪滿容器＋微縮放 hover */
    .g-item img{
      width:100%; height:100%; object-fit:cover; display:block;
      transition: transform .35s ease;
    }
    .g-item:hover img{ transform: scale(1.04); }

    /* 覆蓋資訊（滑過顯示） */
    .g-cap{
      position:absolute; inset:0; display:flex; align-items:end;
      padding:.75rem .85rem; color:#fff;
      background: linear-gradient(to top, rgba(0,0,0,.55), rgba(0,0,0,0) 55%);
      opacity:0; transition:opacity .25s ease;
    }
    .g-item:hover .g-cap{ opacity:1; }
    .g-cap .title{ font-weight:700; font-size:.95rem; line-height:1.2; }
    .g-cap .meta{ font-size:.8rem; opacity:.9; }

    /* 深色模式：提高覆蓋資訊對比 */
    [data-bs-theme="dark"] .g-cap{
      background: linear-gradient(to top, rgba(0,0,0,.7), rgba(0,0,0,0) 55%);
    }

    /* 可及性：減少動態效果 */
    @media (prefers-reduced-motion: reduce){
      .g-item img{ transition:none; }
      .g-item:hover img{ transform:none; }
      .g-cap{ transition:none; }
    }

    .footer{ opacity:.7; }
  </style>

  <script>
    // 啟用 tooltip
    document.addEventListener('DOMContentLoaded', function () {
      [...document.querySelectorAll('[data-bs-toggle="tooltip"]')]
        .forEach(el => new bootstrap.Tooltip(el));
    });

    // Footer 年份/時間
    const elYear = document.getElementById('year');
    const elUpdated = document.getElementById('updated');
    if (elYear)   elYear.textContent   = new Date().getFullYear();
    if (elUpdated)elUpdated.textContent= new Date().toISOString().slice(0,10);

    // ----- 主題切換（沿用首頁） -----
    const root = document.documentElement;
    const STORAGE_KEY = 'pref-theme';
    const btnDesktop = document.getElementById('themeToggleDesktop');

    function syncIcons(theme){
      const icon = (theme === 'dark') ? 'bi-moon-stars' : 'bi-sun';
      [btnDesktop].forEach(btn=>{
        if (!btn) return;
        const i = btn.querySelector('i'); if (!i) return;
        i.className = 'bi ' + icon;
        btn.setAttribute('aria-label', theme === 'dark' ? 'Switch to light theme' : 'Switch to dark theme');
      });
    }
    function applyTheme(theme){
      root.setAttribute('data-bs-theme', theme);
      localStorage.setItem(STORAGE_KEY, theme);
      syncIcons(theme);
    }
    function getSavedOrSystemTheme(){
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved === 'light' || saved === 'dark') return saved;
      return (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
    }
    let userSet = !!localStorage.getItem(STORAGE_KEY);
    applyTheme(getSavedOrSystemTheme());
    if (window.matchMedia){
      const mq = window.matchMedia('(prefers-color-scheme: dark)');
      mq.addEventListener?.('change', e=>{
        if (!userSet) applyTheme(e.matches ? 'dark' : 'light');
      });
    }
    function toggleTheme(){
      userSet = true;
      const curr = root.getAttribute('data-bs-theme') || 'light';
      applyTheme(curr === 'dark' ? 'light' : 'dark');
    }
    btnDesktop?.addEventListener('click', toggleTheme);

  <!-- Confetti effect -->
  <script>
    var confettiColors = [
      '#6366f1','#06b6d4','#f59e0b','#ec4899','#10b981','#8b5cf6',
      '#f43f5e','#14b8a6','#a855f7','#facc15','#fb923c','#38bdf8',
      '#e879f9','#4ade80','#fbbf24','#f472b6'
    ];

    function fireConfetti() {
      var duration = 1250;
      var end = Date.now() + duration;
      (function frame() {
        confetti({ particleCount:4, angle:60,  spread:60, origin:{x:0,y:0.6}, colors:confettiColors, gravity:0.9, drift:0.6,  ticks:180 });
        confetti({ particleCount:4, angle:120, spread:60, origin:{x:1,y:0.6}, colors:confettiColors, gravity:0.9, drift:-0.6, ticks:180 });
        if (Date.now() < end) requestAnimationFrame(frame);
      })();
      setTimeout(function () {
        confetti({ particleCount:120, spread:140, origin:{y:0.35}, colors:confettiColors, gravity:1, scalar:1.2, ticks:250 });
        confetti({ particleCount:80, spread:100, origin:{y:0.4},  colors:confettiColors, gravity:0.9, scalar:1, ticks:220 });
      }, 200);
    }

    document.addEventListener('DOMContentLoaded', function () {
      // Remove greeting after animation
      setTimeout(function () {
        var ov = document.getElementById('greetOverlay');
        if (ov) ov.remove();
      }, 3300);

      // Initial confetti
      fireConfetti();

      // Re-trigger on emoji click
      var btn = document.getElementById('confettiBtn');
      if (btn) btn.addEventListener('click', fireConfetti);
    });
  </script>
