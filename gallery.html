<!doctype html>
<html lang="zh-Hant" data-bs-theme="auto">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gallery — Kuan-Lin (Brian) Chen</title>
  <meta name="description" content="Selected photography by Kuan-Lin (Brian) Chen." />

  <meta property="og:title" content="Gallery — Kuan-Lin (Brian) Chen" />
  <meta property="og:description" content="Selected photography by Kuan-Lin (Brian) Chen." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="https://brianchen1120.github.io/assets/og.png" />
  <meta property="og:url" content="https://brianchen1120.github.io/gallery.html" />

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <link rel="icon" href="assets/favicon.png" sizes="any">
  <link rel="stylesheet" href="assets/gallery-app/gallery.css">
  <link rel="preload" href="assets/gallery-app/photos.json" as="fetch" crossorigin>
  <link rel="modulepreload" href="assets/gallery-app/js/main.js">

  <!-- 首次繪製前套用主題（與首頁同一個 pref-theme） -->
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem('pref-theme'); } catch (e) {}
      if (t !== 'light' && t !== 'dark') {
        t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-bs-theme', t);
    })();
  </script>

  <style>
    :root{
      --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
      --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
      --dur-press: 160ms;
    }

    html{ scroll-behavior:smooth; }
    body{ font-optical-sizing:auto; }

    .greeting-overlay {
      position: fixed; inset: 0; z-index: 99999;
      display: flex; align-items: center; justify-content: center;
      pointer-events: none;
    }
    .greeting-text {
      font-size: clamp(1.8rem, 5vw, 3.5rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #6366f1, #06b6d4, #f59e0b, #ec4899);
      background-size: 200% 200%;
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: greetIn 0.55s var(--ease-out), greetGradient 3s ease infinite, greetOut 0.6s 2.5s ease-in forwards;
      opacity: 0; transform: scale(0.6);
      background-color: rgba(255,255,255,0.85);
      padding: .3rem 1.2rem;
      border-radius: .75rem;
      -webkit-text-fill-color: transparent;
    }
    [data-bs-theme="dark"] .greeting-text {
      background-color: rgba(30,30,30,0.85);
    }

    @keyframes greetIn      { 0%{opacity:0;transform:scale(0.6)} 70%{opacity:1;transform:scale(1.04)} 100%{opacity:1;transform:scale(1)} }
    @keyframes greetGradient { 0%,100%{background-position:0% 50%} 50%{background-position:100% 50%} }
    @keyframes greetOut      { 0%{opacity:1;transform:scale(1)} 100%{opacity:0;transform:scale(1.15) translateY(-20px)} }

    .glass-nav{
      background: var(--nc-glass);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      box-shadow: 0 1px 0 rgba(0, 0, 0, .04);
      transition: box-shadow .3s ease, background-color .3s ease;
    }
    [data-bs-theme="dark"] .glass-nav{
      box-shadow: 0 1px 0 rgba(255, 255, 255, .06);
    }
    .glass-nav.scrolled{ box-shadow: 0 2px 16px rgba(0, 0, 0, .08); }
    [data-bs-theme="dark"] .glass-nav.scrolled{ box-shadow: 0 2px 18px rgba(0, 0, 0, .45); }
    @media (prefers-reduced-transparency: reduce){
      .glass-nav{
        background: var(--bs-body-bg);
        backdrop-filter: none; -webkit-backdrop-filter: none;
        border-bottom: 1px solid var(--bs-border-color);
      }
    }

    .icon-btn{ background:transparent; border:0; padding:.375rem; line-height:1; }
    .icon-btn:focus, .icon-btn:focus-visible{ outline:none; box-shadow:none; }
    .icon-btn:hover{ opacity:.85; }
    .nav-link .bi, .icon-btn .bi{ vertical-align:-2px; }
    .btn, .icon-btn{
      transition: transform var(--dur-press) ease-out, opacity .2s ease,
                  background-color .2s ease, border-color .2s ease, color .2s ease;
    }
    .btn:active, .icon-btn:active{ transform: scale(.96); }

    .lead-wrap{ max-width:820px; margin-inline:auto; }
    .lead-wrap h1{ letter-spacing:-0.02em; }


    html.theme-transition, html.theme-transition *{
      transition: background-color .35s ease, color .35s ease,
                  border-color .35s ease, box-shadow .35s ease !important;
    }

    @media (prefers-reduced-motion: reduce){
      html{ scroll-behavior:auto; }
      .btn:active, .icon-btn:active{ transform:none; }
      html.theme-transition, html.theme-transition *{ transition:none !important; }

      @keyframes greetIn  { 0%{opacity:0} 100%{opacity:1} }
      @keyframes greetOut { 0%{opacity:1} 100%{opacity:0} }
      .greeting-text{ transform:none; animation: greetIn .3s ease-out, greetOut .5s 2.3s ease-in forwards; }
    }

    .mg-launcher{
      position: fixed; right: 1rem; bottom: 1rem; z-index: 2400;
      display: flex; align-items: center; gap: .5rem;
      background: none; border: 0; padding: 0;
      cursor: pointer;
      transition: transform .35s var(--ease-out);
    }
    .mg-launcher img{
      width: 84px; height: auto; display: block;
      filter: drop-shadow(0 6px 14px rgba(0,0,0,.3));
      pointer-events: none;
    }
    .mg-launcher .mg-label{
      order: -1;
      width: 34px; height: 34px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      background: rgba(20,20,24,.55);
      font-size: .95rem; line-height: 1;
      backdrop-filter: blur(12px) saturate(160%);
      -webkit-backdrop-filter: blur(12px) saturate(160%);
      transition: opacity .3s ease, transform .35s var(--ease-out);
    }
    @media (hover:hover){
      .mg-launcher:hover{ transform: translateY(-5px); }
      .mg-launcher .mg-label{ opacity:.75; }
      .mg-launcher:hover .mg-label{ opacity:1; transform:translateX(-3px); }
    }
    .mg-launcher:active{ transform: scale(.94); }

    .mg-launcher.wave img{ animation: mgWave .9s var(--ease-out) 1; }
    @keyframes mgWave{
      0%,100%{ transform: rotate(0) }
      25%{ transform: rotate(-9deg) }
      60%{ transform: rotate(7deg) }
    }
    @media (max-width:576px){
      .mg-launcher img{ width: 68px; }
      .mg-launcher .mg-label{ display:none; }
    }

    body.mg-open{ overflow:hidden; }
    .mg-backdrop{
      position:fixed; inset:0; z-index:3500;
      background:rgba(8,8,10,.72);
      backdrop-filter:blur(16px) saturate(140%);
      -webkit-backdrop-filter:blur(16px) saturate(140%);
      opacity:0; transition:opacity .4s var(--ease-out);
    }
    .mg-backdrop.show{ opacity:1; }
    .mg-panel{
      position:fixed; z-index:3501; left:50%; top:50%;
      transform:translate(-50%,-50%) scale(.94); opacity:0;
      transition:transform .45s var(--ease-out), opacity .3s ease;
      border-radius:1rem; overflow:hidden;
      box-shadow:0 30px 90px rgba(0,0,0,.5);
      background:#111;
    }
    .mg-panel.show{ transform:translate(-50%,-50%) scale(1); opacity:1; }

    .mg-field{
      position:relative;
      aspect-ratio: 2 / 3;
      height: min(84vh, 880px);
      width: auto;
      max-width: 92vw;
      overflow:hidden;
      cursor: url("assets/mascot/cursor_camera.png") 16 16, crosshair;
      touch-action: manipulation;
      background:#1a1a1e;
    }
    .mg-field .mg-bg{
      position:absolute; inset:0; width:100%; height:100%;
      object-fit:cover;
      filter:brightness(.86) saturate(.97);
      user-select:none; -webkit-user-drag:none; pointer-events:none;
    }
    #mgMascot{
      position:absolute; left:0; top:0;
      will-change:transform; pointer-events:none;
      user-select:none; -webkit-user-drag:none;
    }
    #mgMascot img{
      width:100%; height:auto; display:block;
      filter: drop-shadow(0 6px 10px rgba(0,0,0,.45));
    }

    .mg-hud{
      position:absolute; left:0; right:0; top:0; z-index:5;
      display:flex; align-items:center; justify-content:space-between;
      gap:.6rem; padding:.6rem .8rem;
      color:#fff; font-size:.85rem;
      background:linear-gradient(to bottom, rgba(0,0,0,.5), rgba(0,0,0,0));
      pointer-events:none;
    }
    .mg-hud .mg-score{ display:flex; gap:.9rem; align-items:center; }
    .mg-hud .divider{ opacity:.35; }
    .mg-hud button{ pointer-events:auto; }
    .mg-iconbtn{
      width:34px; height:34px; border-radius:50%; border:0;
      display:flex; align-items:center; justify-content:center;
      background:rgba(30,30,34,.55); color:#fff; cursor:pointer;
      backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
      transition:background-color .2s ease, transform var(--dur-press) ease-out;
    }
    .mg-iconbtn:hover{ background:rgba(60,60,68,.7); }
    .mg-iconbtn:active{ transform:scale(.92); }

    .shutter-flash{
      position:fixed; inset:0; z-index:4000; background:#fff;
      opacity:0; pointer-events:none;
    }
    .shutter-flash.fire{ animation: flashFire .28s ease-out; }
    @keyframes flashFire{ 0%{opacity:0} 12%{opacity:.95} 100%{opacity:0} }

    .shot-backdrop{
      position:fixed; inset:0; z-index:4100;
      background:rgba(8,8,10,.6);
      backdrop-filter:blur(12px) saturate(140%);
      -webkit-backdrop-filter:blur(12px) saturate(140%);
      opacity:0; transition:opacity .35s var(--ease-out);
    }
    .shot-backdrop.show{ opacity:1; }
    .polaroid{
      position:fixed; z-index:4101; left:50%; top:50%;
      background:#fdfdf8;
      padding:14px 14px 0;
      border-radius:6px;
      box-shadow:0 24px 70px rgba(0,0,0,.45);
      transform:translate(-50%,-50%) scale(.5) rotate(-6deg);
      opacity:0;
      transition:transform .5s var(--ease-out), opacity .3s ease;
      text-align:center;
    }
    .polaroid.show{ transform:translate(-50%,-50%) scale(1) rotate(-1.5deg); opacity:1; }
    .polaroid canvas{
      display:block; border-radius:2px; margin-inline:auto;
      max-height:min(62vh, 660px); width:auto; max-width:82vw;
    }

    .polaroid .shot-foot{
      display:flex; align-items:center; justify-content:space-between;
      gap:.7rem; padding:.6rem .1rem .8rem;
    }
    .polaroid .shot-qr{
      width:46px; height:46px; flex:0 0 auto; display:block;
      border-radius:3px;
    }
    .polaroid .shot-caption{
      flex:1 1 auto; text-align:center;
      font-weight:700; color:#2c2c2c;
      font-size:1.05rem; letter-spacing:-0.01em;
      font-family:'Segoe Print','Comic Sans MS',cursive,sans-serif;
    }
    .polaroid .shot-meta{
      flex:0 0 auto; display:flex; flex-direction:column;
      align-items:flex-end; gap:.3rem;
    }
    .polaroid .shot-date{
      font-size:.7rem; color:#999; letter-spacing:.03em;
      font-variant-numeric:tabular-nums;
    }
    .polaroid .shot-dl{
      border:0; background:rgba(0,0,0,.06); color:#444;
      width:30px; height:30px; border-radius:50%;
      display:flex; align-items:center; justify-content:center;
      cursor:pointer; font-size:.85rem;
      transition:background-color .2s ease, transform var(--dur-press) ease-out;
    }
    .polaroid .shot-dl:hover{ background:rgba(0,0,0,.12); }
    .polaroid .shot-dl:active{ transform:scale(.9); }

    @media (prefers-reduced-motion: reduce){
      .mg-launcher{ transition:none; }
      .mg-launcher.wave img{ animation:none; }
      .mg-panel{ transition:opacity .25s ease; transform:translate(-50%,-50%); }
      .polaroid{ transition:opacity .25s ease; transform:translate(-50%,-50%); }
      .polaroid.show{ transform:translate(-50%,-50%); }
    }

    .footer{ opacity:.7; }
</style>
</head>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      [...document.querySelectorAll('[data-bs-toggle="tooltip"]')]
        .forEach(el => new bootstrap.Tooltip(el));
    });

    const elYear = document.getElementById('year');
    const elUpdated = document.getElementById('updated');
    if (elYear)   elYear.textContent   = new Date().getFullYear();
    if (elUpdated)elUpdated.textContent= new Date().toISOString().slice(0,10);

    const root = document.documentElement;
    const STORAGE_KEY = 'pref-theme';
    const btnDesktop = document.getElementById('themeToggleDesktop');

    function syncIcons(theme){
      const icon = (theme === 'dark') ? 'bi-moon-stars' : 'bi-sun';
      [btnDesktop].forEach(btn=>{
        if (!btn) return;
        const i = btn.querySelector('i'); if (!i) return;
        i.className = 'bi ' + icon;
        btn.setAttribute('aria-label', theme === 'dark' ? 'Switch to light theme' : 'Switch to dark theme');
      });
    }
    function applyTheme(theme){
      root.setAttribute('data-bs-theme', theme);
      localStorage.setItem(STORAGE_KEY, theme);
      syncIcons(theme);
    }
    function getSavedOrSystemTheme(){
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved === 'light' || saved === 'dark') return saved;
      return (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
    }
    let userSet = !!localStorage.getItem(STORAGE_KEY);
    applyTheme(getSavedOrSystemTheme());
    if (window.matchMedia){
      const mq = window.matchMedia('(prefers-color-scheme: dark)');
      mq.addEventListener?.('change', e=>{
        if (!userSet) applyTheme(e.matches ? 'dark' : 'light');
      });
    }
    function toggleTheme(){
      userSet = true;
      root.classList.add('theme-transition');
      setTimeout(()=> root.classList.remove('theme-transition'), 400);
      const curr = root.getAttribute('data-bs-theme') || 'light';
      applyTheme(curr === 'dark' ? 'light' : 'dark');
    }
    btnDesktop?.addEventListener('click', toggleTheme);

    (function(){
      const navs = document.querySelectorAll('.glass-nav');
      if (!navs.length) return;
      const onScroll = () => {
        const s = window.scrollY > 8;
        navs.forEach(n => n.classList.toggle('scrolled', s));
      };
      document.addEventListener('scroll', onScroll, { passive: true });
      onScroll();
    })();

</script>

  <script type="module" src="assets/gallery-app/js/main.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      setTimeout(function () {
        var ov = document.getElementById('greetOverlay');
        if (ov) ov.remove();
      }, 3300);
    });
</script>

  <script>
    (function(){
      const launcher = document.getElementById('mgLauncher');
      const flash = document.getElementById('flash');
      if (!launcher) return;

      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const A = 'assets/mascot/';
      const POSE = {
        stand: [A+'Stand1.webp', A+'Stand2.webp', A+'Stand3.webp'],
        run:   [A+'Run1.webp',   A+'Run2.webp',   A+'Run3.webp'],
        nice:  [A+'NiceShot1.webp', A+'NiceShot2.webp', A+'NiceShot3.webp'],
        fail:  [A+'FailShot1.webp', A+'FailShot2.webp', A+'FailShot3.webp']
      };
      const pick = arr => arr[(Math.random() * arr.length) | 0];
      const rand = (a, b) => a + Math.random() * (b - a);
      const QR_SRC = A + 'qr_site.png';

      const CAP_NICE = ['Nice Shot', 'Perfect Shot'];
      const CAP_FAIL = ['Blurry Shot', 'Missed Shot'];

      let G = null;
      let preloaded = false;

      let TOUCH_MODE = !window.matchMedia('(hover: hover) and (pointer: fine)').matches;
      function useMode(touch){
        if (TOUCH_MODE === touch) return;
        TOUCH_MODE = touch;
        if (!G) return;
        G.mode = 'idle'; G.waypoint = null; G.fleeStart = 0;
        if (touch){
          G.pointer = null;
          G.phase = 'stand'; G.phaseUntil = performance.now() + 300; G.respeedAt = 0;
        } else {
          G.pauseUntil = 0;
        }
      }
      function notePointer(e){
        if (e.pointerType === 'touch' || e.pointerType === 'pen') useMode(true);
        else if (e.pointerType === 'mouse') useMode(false);
      }

      function preload(){
        if (preloaded) return;
        preloaded = true;
        [].concat(POSE.stand, POSE.run, POSE.nice, POSE.fail, [QR_SRC])
          .forEach(src => { const i = new Image(); i.src = src; });
      }

      function shutterSound(){
        try{
          const ctx = shutterSound.ctx ||
            (shutterSound.ctx = new (window.AudioContext || window.webkitAudioContext)());
          const t = ctx.currentTime;
          [0, .06].forEach(function(off, k){
            const o = ctx.createOscillator(), g = ctx.createGain();
            o.type = 'square';
            o.frequency.value = k ? 2200 : 3400;
            g.gain.setValueAtTime(.1, t + off);
            g.gain.exponentialRampToValueAtTime(.0001, t + off + .045);
            o.connect(g); g.connect(ctx.destination);
            o.start(t + off); o.stop(t + off + .05);
          });
        }catch(e){}
      }
      function fireFlash(){
        flash.classList.remove('fire');
        void flash.offsetWidth;
        flash.classList.add('fire');
      }

      function buildUI(){
        const backdrop = document.createElement('div');
        backdrop.className = 'mg-backdrop';

        const panel = document.createElement('div');
        panel.className = 'mg-panel';
        panel.innerHTML =
          '<div class="mg-field">' +
            '<img class="mg-bg" alt="">' +
            '<div id="mgMascot"><img alt="mascot"></div>' +
            '<div class="mg-hud">' +
              '<div class="mg-score">' +
                '<span>📸 <strong class="mg-nice">0</strong></span>' +
                '<span class="divider">|</span>' +
                '<span>😵 <strong class="mg-fail">0</strong></span>' +
              '</div>' +
              '<div style="display:flex;gap:.4rem">' +
                '<button class="mg-iconbtn mg-shuffle" type="button" aria-label="換場景"><i class="bi bi-shuffle"></i></button>' +
                '<button class="mg-iconbtn mg-close" type="button" aria-label="關閉"><i class="bi bi-x-lg"></i></button>' +
              '</div>' +
            '</div>' +
          '</div>';

        document.body.append(backdrop, panel);
        return { backdrop, panel };
      }

      function pickScene(){
        // 縮圖可能還沒載入（Browse 隱藏時是 lazy），用 width/height 屬性判斷直橫
        const all = Array.from(document.querySelectorAll('.g-item img')).filter(i => i.width && i.height);
        const portrait = all.filter(i => i.height > i.width);
        const pool = portrait.length ? portrait : all;
        return pool.length ? pick(pool) : null;
      }

      function open(){
        if (G) return;
        preload();
        const { backdrop, panel } = buildUI();
        const field = panel.querySelector('.mg-field');
        const bg = panel.querySelector('.mg-bg');
        const mascot = panel.querySelector('#mgMascot');
        const mImg = mascot.querySelector('img');

        G = {
          backdrop, panel, field, bg, mascot, mImg,
          scene: null,
          size: 110,
          pos: { x: 0, y: 0 },
          vel: { x: 0, y: 0 },
          dir: 1,
          pose: 'stand', poseFlip: 1,
          mode: 'idle',
          phase: 'stand',
          phaseUntil: 0, respeedAt: 0,
          wanderSpd: 280,
          waypoint: null,
          pauseUntil: 0,
          dashUntil: 0,
          nextJuke: 0,
          fleeStart: 0,
          pointer: null,
          lastShot: 0,
          raf: 0,
          score: { nice: 0, fail: 0 }
        };

        setScene();
        layout();
        setPose('stand');

        const r = field.getBoundingClientRect();
        G.pos.x = rand(r.width * .3, r.width * .7);
        G.pos.y = rand(r.height * .4, r.height * .75);
        render();

        field.addEventListener('pointermove', onPointerMove);
        field.addEventListener('pointerleave', onPointerLeave);
        field.addEventListener('pointerdown', onShoot);
        panel.querySelector('.mg-close').addEventListener('click', close);
        panel.querySelector('.mg-shuffle').addEventListener('click', function(e){
          e.stopPropagation(); setScene();
        });
        backdrop.addEventListener('click', close);
        document.addEventListener('keydown', onKey);
        window.addEventListener('resize', layout);

        document.body.classList.add('mg-open');
        requestAnimationFrame(function(){ requestAnimationFrame(function(){
          backdrop.classList.add('show');
          panel.classList.add('show');
        });});
        setTimeout(layout, 500);

        G.last = performance.now();
        G.raf = requestAnimationFrame(loop);
      }

      function close(){
        if (!G) return;
        const { backdrop, panel, field } = G;
        cancelAnimationFrame(G.raf);
        field.removeEventListener('pointermove', onPointerMove);
        field.removeEventListener('pointerleave', onPointerLeave);
        field.removeEventListener('pointerdown', onShoot);
        document.removeEventListener('keydown', onKey);
        window.removeEventListener('resize', layout);
        backdrop.classList.remove('show');
        panel.classList.remove('show');
        G = null;
        document.body.classList.remove('mg-open');
        setTimeout(function(){ backdrop.remove(); panel.remove(); }, 420);
      }
      function onKey(e){
        if (e.key === 'Escape' && !document.querySelector('.shot-backdrop')) close();
      }

      function setScene(){
        const src = pickScene();
        G.scene = src;
        // 遊戲畫面比縮圖大：從 srcset 取第二檔（960w），沒有就用最大的
        const set = src && src.srcset ? src.srcset.split(',').map(x => x.trim().split(' ')[0]) : [];
        G.bg.src = src ? (set[Math.min(1, set.length - 1)] || src.src) : '';

        if (src && src.width){
          G.field.style.aspectRatio = src.width + ' / ' + src.height;
        }
        layout();
      }
      function layout(){
        if (!G) return;

        const w = G.field.offsetWidth, h = G.field.offsetHeight;
        if (!w) return;

        const ratio = w < 480 ? 0.224 : 0.20;
        G.size = Math.max(77, Math.min(150, w * ratio));
        G.mascot.style.width = G.size + 'px';
        G.pos.x = Math.min(Math.max(G.pos.x, G.size * .5), Math.max(w - G.size * .5, G.size));
        G.pos.y = Math.min(Math.max(G.pos.y, G.size), Math.max(h - G.size * .12, G.size));
      }

      function setPose(kind){
        G.pose = kind;
        G.poseFlip = (kind === 'run') ? -1 : 1;
        G.mImg.src = pick(POSE[kind]);
      }
      function render(){
        G.mascot.style.transform =
          'translate(' + (G.pos.x - G.size / 2) + 'px,' + (G.pos.y - G.size * .92) + 'px)' +
          ' scaleX(' + (G.dir * (G.poseFlip || 1)) + ')';
      }

      function onPointerMove(e){
        if (!G) return;
        notePointer(e);
        if (TOUCH_MODE){ G.pointer = null; return; }
        const r = G.field.getBoundingClientRect();
        G.pointer = { x: e.clientX - r.left, y: e.clientY - r.top };
      }
      function onPointerLeave(){ if (G) G.pointer = null; }

      const FLEE_DIST = 200;
      const MAX_SPEED = 900;

      const WARMUP_MS = 3000, SPD_FROM = .8, SPD_TO = 1.1;
      function fleeScale(now){
        if (!G.fleeStart) return SPD_FROM;
        const t = Math.min((now - G.fleeStart) / WARMUP_MS, 1);
        return SPD_FROM + (SPD_TO - SPD_FROM) * t;
      }

      function startDash(now, W, H, toward){
        const cx = W / 2, cy = H / 2;
        let ang = toward != null ? toward : Math.atan2(cy - G.pos.y, cx - G.pos.x);
        ang += rand(-.5, .5);
        const spd = rand(620, 880) * fleeScale(now);
        G.vel.x = Math.cos(ang) * spd;
        G.vel.y = Math.sin(ang) * spd;
        G.dashUntil = now + rand(380, 620);
      }

      function loop(now){
        if (!G) return;
        const dt = Math.min((now - G.last) / 1000, .05);
        G.last = now;
        const r = G.field.getBoundingClientRect();
        const W = r.width, H = r.height;
        const half = G.size * .5;
        const dashing = now < G.dashUntil;

        if (!TOUCH_MODE && G.pointer && !dashing){
          const dx = G.pos.x - G.pointer.x, dy = (G.pos.y - G.size * .45) - G.pointer.y;
          const d = Math.hypot(dx, dy);
          if (d < FLEE_DIST){
            if (G.mode !== 'flee'){
              G.mode = 'flee'; setPose('run');
              G.nextJuke = now + rand(280, 700);
              G.fleeStart = now;
            }
            const warm = fleeScale(now);

            const margin = G.size * 1.1;
            const nearX = G.pos.x < margin || G.pos.x > W - margin;
            const nearY = G.pos.y < margin * 1.3 || G.pos.y > H - margin * .5;
            if ((nearX && nearY) || (d < FLEE_DIST * .42 && (nearX || nearY))){

              const past = Math.atan2(G.pointer.y - G.pos.y, G.pointer.x - G.pos.x);
              startDash(now, W, H, Math.random() < .65 ? past : null);
            } else {

              const urge = 1 - d / FLEE_DIST;
              const ang = Math.atan2(dy, dx) + rand(-.75, .75);
              const spd = (200 + urge * rand(280, 520)) * warm;
              G.vel.x += Math.cos(ang) * spd * dt * 6;
              G.vel.y += Math.sin(ang) * spd * dt * 6;

              if (now > G.nextJuke){
                G.nextJuke = now + rand(300, 800);
                const perp = Math.atan2(dy, dx) + (Math.random() < .5 ? 1.57 : -1.57);
                const kick = rand(120, 300) * warm;
                G.vel.x += Math.cos(perp) * kick;
                G.vel.y += Math.sin(perp) * kick;
              }
            }
          } else if (G.mode === 'flee' && Math.hypot(G.vel.x, G.vel.y) < 45){
            G.mode = 'idle'; G.waypoint = null; G.fleeStart = 0; setPose('stand');

            G.phase = 'stand'; G.phaseUntil = now + rand(700, 1300); G.respeedAt = 0;
          }
        } else if (!dashing && G.mode === 'flee' && Math.hypot(G.vel.x, G.vel.y) < 45){
          G.mode = 'idle'; G.waypoint = null; setPose('stand');
        }

        const pad = G.size * 1.15;
        const wallK = G.mode === 'flee' ? 1500 : 500;
        if (G.pos.x < pad)        G.vel.x += (1 - G.pos.x / pad) * wallK * dt;
        if (G.pos.x > W - pad)    G.vel.x -= (1 - (W - G.pos.x) / pad) * wallK * dt;
        if (G.pos.y < pad * 1.25) G.vel.y += (1 - G.pos.y / (pad * 1.25)) * wallK * dt;
        if (G.pos.y > H - pad * .6) G.vel.y -= (1 - (H - G.pos.y) / (pad * .6)) * wallK * dt;

        if (TOUCH_MODE && G.mode === 'idle'){
          const UNIT = 40;
          const STAND_MS_MIN = 2000, STAND_MS_MAX = 3000;
          const RUN_MS_MIN = 7500, RUN_MS_MAX = 8500;
          const RESPEED_MS_MIN = 1400, RESPEED_MS_MAX = 2600;

          if (G.phase === 'stand'){
            if (G.pose !== 'stand') setPose('stand');
            if (now > G.phaseUntil){
              G.phase = 'run';
              G.phaseUntil = now + rand(RUN_MS_MIN, RUN_MS_MAX);
              G.respeedAt = 0;
              setPose('run');
            }
          } else {
            if (G.pose !== 'run') setPose('run');
            if (now > G.phaseUntil){
              G.phase = 'stand';
              G.phaseUntil = now + rand(STAND_MS_MIN, STAND_MS_MAX);
              G.respeedAt = 0;
            }
          }

          if (now > G.respeedAt){
            G.respeedAt = now + rand(RESPEED_MS_MIN, RESPEED_MS_MAX);
            G.wanderSpd = (G.phase === 'run' ? rand(7, 15) : rand(3, 7)) * UNIT;
          }

          if (!G.waypoint ||
              Math.hypot(G.waypoint.x - G.pos.x, G.waypoint.y - G.pos.y) < 14){
            G.waypoint = { x: rand(pad, W - pad), y: rand(H * .3, H - pad * .5) };
          }
          const target = G.wanderSpd || 280;
          const dx = G.waypoint.x - G.pos.x, dy = G.waypoint.y - G.pos.y;
          const d = Math.hypot(dx, dy) || 1;
          G.vel.x += (dx / d * target - G.vel.x) * Math.min(dt * 2.4, 1);
          G.vel.y += (dy / d * target - G.vel.y) * Math.min(dt * 2.4, 1);
        } else if (G.mode === 'idle' && now > G.pauseUntil){

          if (!G.waypoint ||
              Math.hypot(G.waypoint.x - G.pos.x, G.waypoint.y - G.pos.y) < 12){
            if (G.waypoint && Math.random() < .5){
              G.pauseUntil = now + rand(700, 2200);
              G.waypoint = null;
              G.vel.x = G.vel.y = 0;
              setPose('stand');
            } else {
              G.waypoint = { x: rand(pad, W - pad), y: rand(H * .3, H - pad * .5) };
              G.wanderSpd = rand(45, 140);
            }
          }
          if (G.waypoint){
            const dx = G.waypoint.x - G.pos.x, dy = G.waypoint.y - G.pos.y;
            const d = Math.hypot(dx, dy) || 1;
            G.vel.x += (dx / d * G.wanderSpd - G.vel.x) * Math.min(dt * 3, 1);
            G.vel.y += (dy / d * G.wanderSpd - G.vel.y) * Math.min(dt * 3, 1);
          }
        }

        const sp = Math.hypot(G.vel.x, G.vel.y);
        if (sp > MAX_SPEED){ G.vel.x *= MAX_SPEED / sp; G.vel.y *= MAX_SPEED / sp; }

        G.pos.x += G.vel.x * dt;
        G.pos.y += G.vel.y * dt;

        const touchMoving = TOUCH_MODE && G.mode === 'idle';
        const damp = dashing ? .4
                   : (G.mode === 'flee' ? 1.5 : (touchMoving ? 1.0 : 2.6));
        G.vel.x -= G.vel.x * Math.min(dt * damp, 1);
        G.vel.y -= G.vel.y * Math.min(dt * damp, 1);

        const topLimit = G.size * .95, botLimit = H - G.size * .12;
        let bounced = false;
        if (G.pos.x < half){ G.pos.x = half; G.vel.x = Math.abs(G.vel.x) * .92 + 120; bounced = true; }
        else if (G.pos.x > W - half){ G.pos.x = W - half; G.vel.x = -Math.abs(G.vel.x) * .92 - 120; bounced = true; }
        if (G.pos.y < topLimit){ G.pos.y = topLimit; G.vel.y = Math.abs(G.vel.y) * .92 + 90; bounced = true; }
        else if (G.pos.y > botLimit){ G.pos.y = botLimit; G.vel.y = -Math.abs(G.vel.y) * .92 - 90; bounced = true; }
        if (bounced){
          G.vel.x += rand(-140, 140);
          G.vel.y += rand(-140, 140);
          if (G.mode === 'flee' && !dashing && Math.random() < .5) startDash(now, W, H);
        }

        if (!TOUCH_MODE){
          const spd = Math.hypot(G.vel.x, G.vel.y);
          if (spd > 190 && G.pose !== 'run') setPose('run');
          else if (spd < 110 && G.pose !== 'stand') setPose('stand');
        }

        if (Math.abs(G.vel.x) > 12) G.dir = G.vel.x > 0 ? 1 : -1;
        render();
        G.raf = requestAnimationFrame(loop);
      }

      function onShoot(e){
        if (!G) return;
        notePointer(e);

        if (e.target.closest && e.target.closest('.mg-hud')) return;
        const now = performance.now();
        if (now - G.lastShot < 450) return;
        G.lastShot = now;

        const r = G.field.getBoundingClientRect();
        const at = { x: e.clientX - r.left, y: e.clientY - r.top };
        const mid = { x: G.pos.x, y: G.pos.y - G.size * .45 };
        const d = Math.hypot(at.x - mid.x, at.y - mid.y);
        const hitR = G.size * .62;
        const nice = d <= hitR;

        fireFlash(); shutterSound();
        G.score[nice ? 'nice' : 'fail']++;
        G.panel.querySelector('.mg-nice').textContent = G.score.nice;
        G.panel.querySelector('.mg-fail').textContent = G.score.fail;

        G.mode = 'flee'; setPose('run');
        startDash(now, r.width, r.height, Math.atan2(mid.y - at.y, mid.x - at.x));

        composeShot(nice, mid, r).then(function(res){
          showPolaroid(res.canvas, res.caption);
        });
      }

      // 合成用畫面上正在顯示的背景（960w）；頁面上的縮圖可能在隱藏的折頁裡、從沒載入過
      function sceneReady(){
        const img = G.bg;
        if (img.complete && img.naturalWidth) return Promise.resolve(img);
        return new Promise(function(res){
          img.addEventListener('load', function(){ res(img); }, { once: true });
          img.addEventListener('error', function(){ res(null); }, { once: true });
        });
      }

      function composeShot(nice, mid, fieldRect){
        return sceneReady().then(function(img){ return composeOn(img, nice, mid, fieldRect); });
      }

      function composeOn(img, nice, mid, fieldRect){
        const ar = (img && img.naturalWidth) ? img.naturalHeight / img.naturalWidth : 1.5;
        const W = 700, H = Math.round(W * ar);
        const cv = document.createElement('canvas');
        cv.width = W; cv.height = H;
        const ctx = cv.getContext('2d');
        const k = W / fieldRect.width;

        if (img && img.naturalWidth){
          try{

            if (!nice) ctx.filter = 'blur(2.2px)';
            ctx.drawImage(img, 0, 0, W, H);
            ctx.filter = 'none';
          }catch(err){
            ctx.filter = 'none';
            ctx.fillStyle = '#8fa3ae'; ctx.fillRect(0, 0, W, H);
          }
        } else {
          ctx.fillStyle = '#8fa3ae'; ctx.fillRect(0, 0, W, H);
        }

        const drawW = G.size * k * (nice ? 1.85 : 1.7);
        const px = mid.x * k;
        const py = mid.y * k;

        const flip = G.dir * (nice ? 1 : -1);

        const sp = new Image();
        const src = nice ? pick(POSE.nice) : pick(POSE.fail);
        return new Promise(function(resolve){
          function finish(){
            const vg = ctx.createRadialGradient(W/2, H/2, H*.42, W/2, H/2, H*.92);
            vg.addColorStop(0, 'rgba(0,0,0,0)');
            vg.addColorStop(1, 'rgba(0,0,0,.28)');
            ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
            resolve({
              canvas: cv,
              caption: (nice ? '✌️ ' : '😵‍💫 ') + pick(nice ? CAP_NICE : CAP_FAIL)
            });
          }
          sp.onload = function(){
            const drawH = drawW * (sp.naturalHeight / sp.naturalWidth);
            ctx.save();
            ctx.translate(px, py);
            if (flip < 0) ctx.scale(-1, 1);
            ctx.drawImage(sp, -drawW / 2, -drawH * .55, drawW, drawH);
            ctx.restore();
            finish();
          };
          sp.onerror = finish;
          sp.src = src;
        });
      }

      function today(){
        const d = new Date();
        const p = n => String(n).padStart(2, '0');
        return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
      }

      function renderCardImage(photo, caption, dateStr){
        const PAD = 44, FOOT = 190;
        const W = photo.width + PAD * 2;
        const H = photo.height + PAD + FOOT;
        const cv = document.createElement('canvas');
        cv.width = W; cv.height = H;
        const ctx = cv.getContext('2d');

        ctx.fillStyle = '#fdfdf8'; ctx.fillRect(0, 0, W, H);
        ctx.drawImage(photo, PAD, PAD);

        const cy = PAD + photo.height + FOOT / 2;
        const QR = 104;

        return new Promise(function(resolve){
          function draw(qr){

            if (qr) ctx.drawImage(qr, PAD, cy - QR / 2, QR, QR);

            const left = PAD + (qr ? QR + 20 : 0);
            const right = W - PAD - 170;
            ctx.fillStyle = '#2c2c2c';
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            let size = 46;
            do {
              ctx.font = '700 ' + size + 'px "Segoe Print","Comic Sans MS",cursive,sans-serif';
              if (ctx.measureText(caption).width <= right - left) break;
              size -= 3;
            } while (size > 24);
            ctx.fillText(caption, (left + right) / 2, cy - 8);

            ctx.fillStyle = '#b4b4b4';
            ctx.font = '400 20px system-ui, sans-serif';
            ctx.fillText('brianchen1120.github.io', (left + right) / 2, cy + 34);

            ctx.fillStyle = '#9a9a9a';
            ctx.font = '400 26px system-ui, sans-serif';
            ctx.textAlign = 'right';
            ctx.fillText(dateStr, W - PAD, cy);
            resolve(cv);
          }
          const qr = new Image();
          qr.onload = function(){ draw(qr); };
          qr.onerror = function(){ draw(null); };
          qr.src = QR_SRC;
        });
      }

      function showPolaroid(canvas, caption){
        const dateStr = today();
        const backdrop = document.createElement('div');
        backdrop.className = 'shot-backdrop';
        const card = document.createElement('div');
        card.className = 'polaroid';
        card.appendChild(canvas);

        const foot = document.createElement('div');
        foot.className = 'shot-foot';
        foot.innerHTML =
          '<img class="shot-qr" src="' + QR_SRC + '" alt="QR code to brianchen1120.github.io">' +
          '<div class="shot-caption"></div>' +
          '<div class="shot-meta">' +
            '<button class="shot-dl" type="button" aria-label="下載這張拍立得"><i class="bi bi-download"></i></button>' +
            '<span class="shot-date">' + dateStr + '</span>' +
          '</div>';
        foot.querySelector('.shot-caption').textContent = caption;
        card.appendChild(foot);

        foot.querySelector('.shot-dl').addEventListener('click', function(e){
          e.stopPropagation();
          renderCardImage(canvas, caption, dateStr).then(function(full){
            const a = document.createElement('a');
            a.download = 'photo-hunt-' + dateStr + '.png';
            a.href = full.toDataURL('image/png');
            a.click();
          });
        });

        const bornAt = performance.now();
        const GUARD = 500;
        function swallow(e){
          if (performance.now() - bornAt < GUARD){
            e.stopPropagation(); e.preventDefault();
          }
        }
        document.addEventListener('click', swallow, true);
        setTimeout(function(){ document.removeEventListener('click', swallow, true); }, GUARD);

        function dismiss(){
          if (performance.now() - bornAt < GUARD) return;
          backdrop.classList.remove('show');
          card.classList.remove('show');
          setTimeout(function(){ backdrop.remove(); card.remove(); }, 400);
          document.removeEventListener('keydown', esc);
          document.removeEventListener('click', swallow, true);
        }
        function esc(e){ if (e.key === 'Escape'){ e.stopPropagation(); dismiss(); } }
        backdrop.addEventListener('click', dismiss);
        card.addEventListener('click', dismiss);
        document.addEventListener('keydown', esc);
        document.body.append(backdrop, card);
        requestAnimationFrame(function(){ requestAnimationFrame(function(){
          backdrop.classList.add('show');
          card.classList.add('show');
        });});
      }

      launcher.addEventListener('click', open);

      if (!reduceMotion && 'IntersectionObserver' in window){
        const io = new IntersectionObserver(function(en){
          en.forEach(function(e){
            if (e.isIntersecting){
              launcher.classList.add('wave');
              io.disconnect();
            }
          });
        });
        io.observe(launcher);
      }

    })();
</script>
</body>
</html>
